# coturn para RemoteX — credenciais temporárias (TURN REST API) geradas pelo servidor.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# static-auth-secret, realm e external-ip vêm da linha de comando (docker-compose.yml)
min-port=49160
max-port=49999
total-quota=200
user-quota=12
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Impede que o TURN seja usado para alcançar redes internas do servidor
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Certificados emitidos pelo Caddy (ajuste o caminho ao seu domínio)
# cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/SEU_DOMINIO/SEU_DOMINIO.crt
# pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/SEU_DOMINIO/SEU_DOMINIO.key
log-file=stdout
